# Tooling config only. This repo is a generator, not a package: the desks are
# scripts run by path, and they import nothing outside the standard library.

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
extend-exclude = [".engine"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
